[package]
name = "rdocs2md"
version = "1.0.2"
edition = "2024"
license = "MIT"
description = "Offline structured document conversion and stdio MCP server"

[dependencies]
cfb = "0.16"
encoding_rs = "0.8"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
glob = "0.3"
lopdf = { version = "0.47", default-features = false }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.8", default-features = false, features = ["deflate-flate2"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
overflow-checks = true